<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Workflow MVP</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#7c3aed',
              500: '#7c3aed',
              400: '#8b5cf6',
            },
            accent: '#22d3ee'
          },
          boxShadow: {
            glow: '0 10px 30px rgba(124,58,237,.35)'
          }
        }
      }
    }
  </script>
  <script>
    (function(){
      try{
        var v = localStorage.getItem('workflow_mvp_theme') || 'neon';
        document.documentElement.style.background = 'radial-gradient(1200px 600px at -10% -10%, rgba(124,58,237,.18), transparent 60%), radial-gradient(900px 500px at 110% -20%, rgba(34,211,238,.14), transparent 60%), radial-gradient(700px 400px at 50% 120%, rgba(245,158,11,.12), transparent 60%), #0b1220';
      }catch(e){}
    })();
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="min-h-screen bg-transparent">
  <div id="root" class="min-h-screen flex items-center justify-center p-4">
    <!-- React mounts here -->
  </div>

  <script>
    const e = React.createElement;

    function Logo(){
      return e('div', { className: 'flex items-center gap-2 mb-4' },
        e('div', { className: 'h-10 w-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent shadow-glow flex items-center justify-center' },
          e('svg', { xmlns:'http://www.w3.org/2000/svg', viewBox:'0 0 24 24', fill:'none', stroke:'white', className:'h-6 w-6', strokeWidth:1.5 },
            e('path', { d:'M12 3l8 4-8 4-8-4 8-4z' }),
            e('path', { d:'M4 10l8 4 8-4', strokeOpacity:.6 }),
            e('path', { d:'M4 14l8 4 8-4', strokeOpacity:.3 })
          )
        ),
        e('div', { className: 'text-white/90 font-medium text-lg' }, 'Workflow')
      );
    }

    function LoginCard(){
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      async function onSubmit(ev){
        ev.preventDefault();
        setError(''); setLoading(true);
        try{
          const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
          if(res.ok){ location.href = '/'; return; }
          const j = await res.json().catch(()=>({}));
          setError(j.error || 'Login failed');
        }catch(err){ setError('Network error'); }
        finally{ setLoading(false); }
      }

      return e('div', { className: 'w-full max-w-md' },
        e('div', { className: 'relative backdrop-blur rounded-2xl border border-white/10 bg-white/5 shadow-2xl shadow-black/40' },
          e('div', { className: 'absolute -inset-px rounded-2xl bg-gradient-to-br from-primary-500/20 to-accent/20 blur-2xl -z-10' }),
          e('div', { className: 'px-6 pt-6' }, e(Logo)),
          e('div', { className: 'px-6 pb-2' },
            e('h2', { className: 'text-xl font-semibold text-white/95' }, 'Sign in'),
            e('p', { className: 'text-sm text-white/60' }, 'Welcome back. Please enter your details.')
          ),
          e('form', { onSubmit: onSubmit, className: 'px-6 pb-6 space-y-4' },
            e('div', null,
              e('label', { className: 'block text-sm text-white/70 mb-1' }, 'Email'),
              e('input', {
                className: 'w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-white placeholder-white/40 outline-none focus:ring-4 focus:ring-primary-500/25 focus:border-primary-400 transition',
                type:'email', placeholder:'you@example.com', value: email, onChange:(ev)=>setEmail(ev.target.value)
              })
            ),
            e('div', null,
              e('label', { className: 'block text-sm text-white/70 mb-1' }, 'Password'),
              e('input', {
                className: 'w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-white placeholder-white/40 outline-none focus:ring-4 focus:ring-primary-500/25 focus:border-primary-400 transition',
                type:'password', placeholder:'••••••••', value: password, onChange:(ev)=>setPassword(ev.target.value)
              })
            ),
            error && e('div', { className:'text-red-400 text-sm' }, error),
            e('button', { type:'submit', disabled: loading || !email || !password,
              className: 'w-full rounded-xl bg-gradient-to-br from-primary-500 to-accent text-white font-medium py-2.5 shadow-glow hover:brightness-110 active:scale-[.99] transition disabled:opacity-60 disabled:cursor-not-allowed' },
              loading ? 'Signing in…' : 'Login'
            ),
            e('div', { className:'flex items-center justify-between text-sm pt-1' },
              e('a', { href:'#', className:'text-white/60 hover:text-white/80 transition' }, 'Forgot Password'),
              e('a', { href:'#', className:'text-white/60 hover:text-white/80 transition' }, 'Create Account')
            )
          )
        )
      );
    }

    function App(){
      return e('div', { className: 'relative w-full min-h-[90vh] flex items-center justify-center' },
        e('div', { className: 'absolute inset-0 -z-10 bg-gradient-to-br from-indigo-900/40 via-slate-900 to-slate-950' }),
        e('div', { className: 'absolute -z-10 inset-0 bg-[radial-gradient(900px_500px_at_20%_-10%,rgba(124,58,237,.25),transparent),radial-gradient(700px_400px_at_110%_10%,rgba(34,211,238,.2),transparent)] animate-[pulse_12s_ease-in-out_infinite]' }),
        e(LoginCard)
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
